# eSIM NL2SQL Platform - Redis（查询缓存）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esim-redis
  namespace: esim-nl2sql
  labels:
    app: esim-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esim-redis
  template:
    metadata:
      labels:
        app: esim-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: esim-redis
  namespace: esim-nl2sql
  labels:
    app: esim-redis
spec:
  selector:
    app: esim-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
