# eSIM NL2SQL Platform - MySQL 8.0（含数据持久化）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esim-mysql-pvc
  namespace: esim-nl2sql
  labels:
    app: esim-mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esim-mysql
  namespace: esim-nl2sql
  labels:
    app: esim-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esim-mysql
  template:
    metadata:
      labels:
        app: esim-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esim-app-secret
                  key: DATABASE_PASSWORD
            - name: MYSQL_DATABASE
              value: esim_platform
          command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: esim-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: esim-mysql
  namespace: esim-nl2sql
  labels:
    app: esim-mysql
spec:
  selector:
    app: esim-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
