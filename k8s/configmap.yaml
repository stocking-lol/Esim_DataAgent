# eSIM NL2SQL Platform - 非敏感应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: esim-app-config
  namespace: esim-nl2sql
data:
  # --- LLM ---
  LLM_PROVIDER: "deepseek"
  LLM_MODEL: "deepseek-chat"
  LLM_MAX_TOKENS: "4096"
  LLM_TEMPERATURE: "0.0"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_BASE_URL: "https://api.deepseek.com/v1"

  # --- 缓存（Redis 后端） ---
  QUERY_CACHE_ENABLED: "true"
  QUERY_CACHE_TTL_SECONDS: "60"
  QUERY_CACHE_MAX_SIZE: "200"
  QUERY_CACHE_BACKEND: "redis"
  REDIS_URL: "redis://esim-redis:6379/0"

  # --- 功能开关 ---
  ENABLE_METRICS: "true"
  AUTO_INIT_TRAINING: "true"
  AUDIT_LOG_ENABLED: "true"

  # --- 服务访问 ---
  CORS_ORIGINS: '["http://localhost:3000"]'
