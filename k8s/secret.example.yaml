# eSIM NL2SQL Platform - 敏感配置示例
# ⚠️ 此文件仅作结构示例，请勿提交真实密钥！
# 部署时用真实值替换：
#   kubectl -n esim-nl2sql create secret generic esim-app-secret \
#     --from-literal=LLM_API_KEY='<真实 Key>' \
#     --from-literal=JWT_SECRET_KEY='<随机 32+ 字符>' \
#     --from-literal=DATABASE_PASSWORD='<数据库密码>'
apiVersion: v1
kind: Secret
metadata:
  name: esim-app-secret
  namespace: esim-nl2sql
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_WITH_REAL_KEY"
  JWT_SECRET_KEY: "REPLACE_WITH_RANDOM_32_CHAR_SECRET"
  DATABASE_PASSWORD: "esim_platform_pass"
