# eSIM NL2SQL Platform - 应用 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esim-app
  namespace: esim-nl2sql
  labels:
    app: esim-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: esim-app
  template:
    metadata:
      labels:
        app: esim-app
    spec:
      containers:
        - name: esim-app
          image: esim-nl2sql-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # 存活探针：进程活着但可能已不可服务
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # 就绪探针：流量只打到可服务的副本
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # 启动探针：给 ChromaDB 加载训练数据留时间
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: esim-app-config
            - secretRef:
                name: esim-app-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# 应用 Service（NodePort 便于本地/裸机访问）
apiVersion: v1
kind: Service
metadata:
  name: esim-app
  namespace: esim-nl2sql
  labels:
    app: esim-app
spec:
  type: NodePort
  selector:
    app: esim-app
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
