version: "3.8"

# ============================================
# eSIM NL2SQL Platform - Docker Compose
# ============================================

services:
  # --- MySQL 8.0 ---
  mysql:
    image: mysql:8.0
    container_name: esim_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: esim_platform_pass
      MYSQL_DATABASE: esim_platform
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
      - ./scripts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pesim_platform_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- ChromaDB (Vector Store) ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: esim_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- FastAPI (commented out during development, run locally) ---
  # fastapi:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: esim_fastapi
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_HOST=mysql
  #     - CHROMADB_HOST=chromadb
  #     - ENABLE_METRICS=true
  #   env_file:
  #     - .env
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app

  # --- Prometheus (指标采集与告警) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: esim_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      - fastapi

  # --- Grafana (可视化仪表盘) ---
  grafana:
    image: grafana/grafana:latest
    container_name: esim_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=esim_grafana_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
    driver: local
  chromadb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
